app = "nba-live-bot"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  NODE_ENV = "production"
  RESTRICT_TO_GUILD = "false"
  PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
  PUPPETEER_NO_SANDBOX = "true"

[processes]
  app = "node bot.js"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[restart]]
  policy = "always"
  processes = ["app"]
